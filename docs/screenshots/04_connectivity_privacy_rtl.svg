  <rect x="30" y="362" width="114" height="32" rx="10" fill="#091B24" stroke="#164E63" stroke-width="1"/>
  <text x="87" y="382" text-anchor="middle" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5">سرور OpenAI</text>

