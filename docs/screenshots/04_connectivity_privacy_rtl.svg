  <line x1="30" y1="226" x2="390" y2="226" stroke="#164E63" stroke-width="1"/>
  <text x="388" y="250" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">فعال‌سازی دسترسی بخش‌های نیازمند اینترنت</text>
  <text x="388" y="269" text-anchor="start" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">پیش‌فرض: غیرفعال — تمام ارتباطات اینترنتی مسدود است</text>
