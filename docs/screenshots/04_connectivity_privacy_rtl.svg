  <text x="388" y="59" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">تنظیم بخش‌های آنلاین، ورود کلیدها و مجوزهای آفلاین</text>
  <rect x="26" y="30" width="90" height="26" rx="13" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
  <text x="71" y="47" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10" font-weight="bold">آفلاین مطلق</text>

  <!-- 1. Hero Privacy Posture & Master Kill-Switch -->
  <rect x="16" y="86" width="388" height="206" rx="22" fill="url(#privCardV2)" stroke="#34D399" stroke-width="1.5"/>
  <text x="388" y="114" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">حالت ۱۰۰٪ آفلاین و خصوصی فعال است</text>
  <text x="388" y="134" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">هیچ داده‌ای از دستگاه خارج نمی‌شود و تمام محاسبات محلی است.</text>

  <!-- Privacy Score Pill -->
  <rect x="28" y="98" width="58" height="46" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
  <text x="57" y="119" text-anchor="middle" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" font-weight="bold">۱۰۰</text>
  <text x="57" y="135" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="8.5">امتیاز امنیت</text>

  <rect x="30" y="152" width="360" height="6" rx="3" fill="#132D3B"/>
  <rect x="30" y="152" width="360" height="6" rx="3" fill="#34D399"/>

  <!-- 3 Mini Status Boxes -->
  <rect x="274" y="168" width="116" height="46" rx="12" fill="#0A1A24" stroke="#1E3A4C" stroke-width="1"/>
  <text x="332" y="185" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">وضعیت شبکه</text>
  <text x="332" y="203" text-anchor="middle" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">آفلاین کامل</text>

  <rect x="152" y="168" width="114" height="46" rx="12" fill="#0A1A24" stroke="#1E3A4C" stroke-width="1"/>
  <text x="209" y="185" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">بخش‌های آنلاین</text>
  <text x="209" y="203" text-anchor="middle" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">۰ از ۲ فعال</text>

