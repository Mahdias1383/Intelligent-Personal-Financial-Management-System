  <rect x="16" y="304" width="388" height="332" rx="22" fill="url(#privCardV2)" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="388" y="330" text-anchor="start" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">🔑 بخش‌های نیازمند اینترنت و ورودی‌های کاربر</text>
  <text x="388" y="348" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">در صورت فعال‌سازی دستی، منبع و کلید یا آدرس سرور را وارد کنید</text>

