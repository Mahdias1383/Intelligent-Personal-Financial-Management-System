  <rect x="30" y="404" width="360" height="44" rx="12" fill="#07161F" stroke="#164E63" stroke-width="1.1"/>
  <text x="378" y="421" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">کلید اختصاصی API Key (ذخیره رمزنگاری‌شده در Keystore)</text>
  <text x="44" y="438" text-anchor="end" fill="#E2E8F0" font-family="monospace" font-size="12">••••••••••••••••••••••••••••</text>

  <rect x="30" y="456" width="360" height="44" rx="12" fill="#07161F" stroke="#164E63" stroke-width="1.1"/>
  <text x="378" y="473" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">آدرس سرور همگام‌سازی ابری (فقط HTTPS معتبر)</text>
  <text x="44" y="490" text-anchor="end" fill="#5EEAD4" font-family="monospace" font-size="11">https://backup.example.com/api/sync</text>

  <rect x="30" y="508" width="360" height="44" rx="12" fill="#07161F" stroke="#164E63" stroke-width="1.1"/>
  <text x="378" y="525" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">توکن احراز هویت سرور (Bearer Token)</text>
  <text x="44" y="542" text-anchor="end" fill="#E2E8F0" font-family="monospace" font-size="12">••••••••••••••••••••</text>

  <!-- Save & Sync Buttons -->
  <rect x="216" y="564" width="174" height="38" rx="11" fill="#14B8A6"/>
  <text x="303" y="587" text-anchor="middle" fill="#042F2E" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="bold">💾 ذخیره ایمن ورودی‌ها</text>

  <rect x="30" y="564" width="176" height="38" rx="11" fill="#102937" stroke="#38BDF8" stroke-width="1"/>
  <text x="118" y="587" text-anchor="middle" fill="#BAE6FD" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">☁ ارسال پشتیبان الان</text>

  <text x="210" y="622" text-anchor="middle" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">✓ کلیدها با AES-256-GCM رمزنگاری شده و وارد فایل JSON نمی‌شوند</text>

  <!-- 3. Thresholds & Privacy Hardening Card -->
  <rect x="16" y="648" width="388" height="214" rx="22" fill="url(#privCardV2)" stroke="#34D399" stroke-width="1.2"/>
  <text x="388" y="674" text-anchor="start" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">🛡 آستانه‌ها و محافظت‌های حریم خصوصی</text>

  <text x="388" y="704" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5">• فقط روی وای‌فای (Wi-Fi Only) — مسدود روی اینترنت همراه</text>
  <text x="40" y="704" text-anchor="end" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">فعال ✓</text>

  <text x="388" y="732" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5">• ناشناس‌سازی نام بانک‌ها و اشخاص پیش از ارسال</text>
  <text x="40" y="732" text-anchor="end" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">فعال ✓</text>

  <text x="388" y="760" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5">• مسدودسازی اسکرین‌شات و نمای برنامه‌های اخیر</text>
  <text x="40" y="760" text-anchor="end" fill="#DAB978" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">قابل تنظیم</text>

  <text x="388" y="788" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5">• سقف سهمیه روزانه هوش مصنوعی: ۱ / ۳ / ۵ / ۱۰ بار</text>

  <rect x="30" y="808" width="360" height="38" rx="12" fill="#063B3D" stroke="#34D399" stroke-width="1"/>
  <text x="210" y="832" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="bold">↺ بازنشانی تک‌لمسی به حالت ۱۰۰٪ آفلاین (غیرفعال‌سازی همه)</text>
</svg>
