<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" width="420" height="880" direction="rtl">
  <defs>
    <linearGradient id="privBgV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#051017"/>
      <stop offset="100%" stop-color="#081A24"/>
    </linearGradient>
    <linearGradient id="privCardV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2430"/>
      <stop offset="100%" stop-color="#0A1B25"/>
    </linearGradient>
  </defs>

  <rect width="420" height="880" rx="28" fill="url(#privBgV2)" stroke="#164E63" stroke-width="2.5"/>

  <!-- Top Bar -->
  <rect x="14" y="14" width="392" height="60" rx="16" fill="#0B1F2A" stroke="#164E63" stroke-width="1"/>
