  <text x="87" y="185" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">سهمیه امروز</text>
  <text x="87" y="203" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">غیرفعال</text>

