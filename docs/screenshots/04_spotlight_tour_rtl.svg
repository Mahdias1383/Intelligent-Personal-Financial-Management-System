<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="420" height="860" direction="rtl">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#070C18"/>
    </linearGradient>
    <linearGradient id="coachGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132238"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Dimmed Scrim Background -->
  <rect width="420" height="860" rx="28" fill="url(#bgGrad4)" stroke="#1E293B" stroke-width="3"/>

  <!-- Dimmed Background UI Hints -->
  <rect x="16" y="20" width="388" height="54" rx="14" fill="#0F172A" opacity="0.35"/>
  <rect x="16" y="310" width="388" height="160" rx="20" fill="#0F172A" opacity="0.25"/>

  <!-- SPOTLIGHT CUTOUT TARGET (Illuminated Element with Pulsing Neon Halo) -->
  <rect x="12" y="84" width="396" height="196" rx="26" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="10 6" opacity="0.65"/>
  <rect x="16" y="88" width="388" height="188" rx="22" fill="#065F46" stroke="#34D399" stroke-width="3"/>

  <rect x="296" y="102" width="94" height="24" rx="8" fill="#022C22"/>
  <text x="343" y="118" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">کارت خلاصه ماه</text>
  <text x="388" y="152" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="22" font-weight="bold">۱۸,۴۵۰,۰۰۰ تومان</text>
  <text x="388" y="176" text-anchor="start" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">مانده اقساط ماه جاری • سقف قسط جدید: ۶,۵۵۰,۰۰۰ تومان</text>
  <rect x="32" y="196" width="356" height="8" rx="4" fill="#022C22"/>
  <rect x="160" y="196" width="228" height="8" rx="4" fill="#34D399"/>
  <text x="388" y="232" text-anchor="start" fill="#D1FAE5" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">پیشرفت پرداخت ماهانه: ۶۴٪ تسویه‌شده</text>

  <!-- Animated Bouncing Graphical Pointer Badge (نشانگر گرافیکی متحرک) -->
  <rect x="130" y="290" width="160" height="36" rx="18" fill="#10B981"/>
  <text x="210" y="313" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">▲ اینجا را ببینید (گام ۲ از ۹)</text>

  <!-- Dynamic Coach-Mark Explanation Card Positioned Below the Spotlight -->
  <rect x="18" y="340" width="384" height="360" rx="24" fill="url(#coachGrad)" stroke="#10B981" stroke-width="2"/>

  <rect x="256" y="358" width="130" height="26" rx="8" fill="#064E3B"/>
  <text x="321" y="375" text-anchor="middle" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">گام ۲ از ۹ • تب داشبورد</text>

  <text x="48" y="375" text-anchor="end" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">رد کردن تور ✕</text>

  <text x="384" y="410" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" font-weight="bold">کارت خلاصه وضعیت ماه و پیشرفت اقساط</text>
  <text x="384" y="436" text-anchor="start" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">در این کارت، کل اقساط باقی‌مانده ماه جاری، درصد پیشرفت پرداخت‌ها،</text>
  <text x="384" y="456" text-anchor="start" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">معادل حروفی زنده و سقف مجاز افزودن قسط جدید را یک‌جا می‌بینید.</text>

  <!-- Highlight Feature Bullets -->
  <rect x="32" y="476" width="356" height="128" rx="14" fill="#090F1B" stroke="#1E293B" stroke-width="1"/>
  <text x="374" y="502" text-anchor="start" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">✓ محاسبه لحظه‌ای مانده اقساط ماه شمسی جاری</text>
  <text x="374" y="532" text-anchor="start" fill="#38BDF8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">✓ نمایش ظرفیت آزاد بودجه برای تعهدات و خریدهای جدید</text>
  <text x="374" y="562" text-anchor="start" fill="#FBBF24" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">✓ تفکیک کامل بدهی‌های شما از مطالبات و قرض‌های داده‌شده</text>
  <text x="374" y="588" text-anchor="start" fill="#C4B5FD" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">✓ اسکرول خودکار و هایلایت نوری هر المان در طول تور آموزشی</text>

  <!-- Step Dots Indicator -->
  <circle cx="268" cy="624" r="4" fill="#475569"/>
  <rect x="242" y="620" width="18" height="8" rx="4" fill="#10B981"/>
  <circle cx="230" cy="624" r="4" fill="#475569"/>
  <circle cx="216" cy="624" r="4" fill="#475569"/>
  <circle cx="202" cy="624" r="4" fill="#475569"/>
  <circle cx="188" cy="624" r="4" fill="#475569"/>
  <circle cx="174" cy="624" r="4" fill="#475569"/>
  <circle cx="160" cy="624" r="4" fill="#475569"/>
  <circle cx="146" cy="624" r="4" fill="#475569"/>

  <!-- Navigation Buttons in Coach Card -->
  <rect x="32" y="644" width="220" height="42" rx="12" fill="#10B981"/>
  <text x="142" y="670" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">المـان بعدی در تور ◂</text>

  <rect x="264" y="644" width="124" height="42" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="326" y="670" text-anchor="middle" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">▸ گام قبلی</text>
</svg>
