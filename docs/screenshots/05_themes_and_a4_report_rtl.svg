<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" width="420" height="880" direction="rtl">
  <defs>
    <linearGradient id="splitDarkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#051017"/>
      <stop offset="100%" stop-color="#081A24"/>
    </linearGradient>
    <linearGradient id="deepTealLightCard" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F8F8"/>
      <stop offset="100%" stop-color="#E4F2F1"/>
    </linearGradient>
  </defs>

  <rect width="420" height="880" rx="28" fill="url(#splitDarkBg)" stroke="#164E63" stroke-width="2.5"/>

  <!-- Header -->
  <rect x="16" y="16" width="388" height="58" rx="16" fill="#0B1F2A" stroke="#164E63" stroke-width="1"/>
  <text x="388" y="42" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15.5" font-weight="bold">سوئیچر پوسته شب/روز و استودیو چاپ A4</text>
  <text x="388" y="61" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">فیروزه تیره روشن + تاریک پُرکنتراست شبانه + PDF رنگی و اکسل RTL</text>

  <!-- 1. Theme Switcher Comparison Card (Deep Teal Light vs High-Contrast Night Dark) -->
  <rect x="16" y="88" width="388" height="278" rx="22" fill="#0C202B" stroke="#DAB978" stroke-width="1.2"/>
  <text x="388" y="114" text-anchor="start" fill="#FDE68A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">🎨 سوئیچر آنی پوسته روز و مدیریت مالی شبانه</text>

  <!-- Right Side: Deep Teal Light Mode Preview -->
  <rect x="216" y="130" width="174" height="178" rx="16" fill="url(#deepTealLightCard)" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="228" y="142" width="150" height="36" rx="10" fill="#0F4C5C"/>
  <text x="303" y="164" text-anchor="middle" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">☀ فیروزه تیره (روشن)</text>
  <text x="378" y="198" text-anchor="start" fill="#0F4C5C" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5" font-weight="bold">مانده ماه جاری:</text>
  <text x="378" y="220" text-anchor="start" fill="#0B2E36" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">۱۸٫۴۵ میلیون تومان</text>
  <rect x="228" y="232" width="150" height="7" rx="3.5" fill="#CBD5E1"/>
  <rect x="278" y="232" width="100" height="7" rx="3.5" fill="#0D9488"/>
  <rect x="228" y="252" width="150" height="42" rx="10" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1"/>
  <text x="303" y="271" text-anchor="middle" fill="#0F766E" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10" font-weight="bold">خوانایی عالی در نور روز</text>
  <text x="303" y="286" text-anchor="middle" fill="#475569" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9">کنتراست استاندارد مادی ۳</text>

  <!-- Left Side: High-Contrast Night Dark Mode Preview -->
  <rect x="30" y="130" width="174" height="178" rx="16" fill="#000000" stroke="#5EEAD4" stroke-width="1.6"/>
  <rect x="42" y="142" width="150" height="36" rx="10" fill="#0B2D30" stroke="#5EEAD4" stroke-width="1"/>
  <text x="117" y="164" text-anchor="middle" fill="#5EEAD4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5" font-weight="bold">🌙 تاریک پُرکنتراست</text>
  <text x="192" y="198" text-anchor="start" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5" font-weight="bold">مانده ماه جاری:</text>
  <text x="192" y="220" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">۱۸٫۴۵ میلیون تومان</text>
  <rect x="42" y="232" width="150" height="7" rx="3.5" fill="#1F2937"/>
  <rect x="92" y="232" width="100" height="7" rx="3.5" fill="#5EEAD4"/>
  <rect x="42" y="252" width="150" height="42" rx="10" fill="#0A1418" stroke="#FBBF24" stroke-width="1"/>
