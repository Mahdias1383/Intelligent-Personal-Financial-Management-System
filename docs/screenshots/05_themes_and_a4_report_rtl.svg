  <rect x="16" y="378" width="388" height="406" rx="22" fill="#0C202B" stroke="#2DD4BF" stroke-width="1.3"/>
  <text x="388" y="406" text-anchor="start" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">🖨 استودیو چاپ رسمی A4 و خروجی اکسل RTL</text>
  <text x="388" y="425" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">تولید کاملاً آفلاین PDF رنگی با فونت وزیرمتن، XLS راست‌به‌چپ و CSV</text>

  <!-- Crisp A4 Sheet Preview -->
  <rect x="40" y="440" width="340" height="252" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
