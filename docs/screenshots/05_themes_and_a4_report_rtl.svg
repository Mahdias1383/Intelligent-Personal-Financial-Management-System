  <text x="209" y="534" text-anchor="middle" fill="#713F12" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10" font-weight="bold">۹۴٫۵ میلیون</text>

  <rect x="52" y="502" width="100" height="40" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.9"/>
  <text x="102" y="518" text-anchor="middle" fill="#1E40AF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="8.5">تعداد پرونده</text>
