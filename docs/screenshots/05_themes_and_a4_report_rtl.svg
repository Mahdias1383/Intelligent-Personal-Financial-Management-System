  <text x="64" y="567" text-anchor="end" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9" font-weight="bold">مبلغ (تومان)</text>

  <rect x="52" y="576" width="316" height="22" fill="#F8FAFC"/>
  <text x="358" y="591" text-anchor="start" fill="#0F172A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9">وام قرض‌الحسنه بانک مهر</text>
  <text x="180" y="591" text-anchor="middle" fill="#334155" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9">۱۴۰۵/۰۸/۲۵</text>
  <text x="64" y="591" text-anchor="end" fill="#0F766E" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9" font-weight="bold">۴٬۸۵۰٬۰۰۰</text>

  <rect x="52" y="600" width="316" height="22" fill="#FFFFFF"/>
  <text x="358" y="615" text-anchor="start" fill="#0F172A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9">خرید اقساطی اسنپ‌پی</text>
  <text x="180" y="615" text-anchor="middle" fill="#334155" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9">۱۴۰۵/۰۹/۰۱</text>
  <text x="64" y="615" text-anchor="end" fill="#0F766E" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9" font-weight="bold">۴٬۰۰۰٬۰۰۰</text>

  <!-- Signature Footer inside A4 -->
  <rect x="52" y="636" width="150" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4 3"/>
  <text x="127" y="662" text-anchor="middle" fill="#64748B" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9">امضا و مهر طرف دوم</text>
  <rect x="218" y="636" width="150" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4 3"/>
  <text x="293" y="662" text-anchor="middle" fill="#64748B" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9">امضا و تایید صاحب حساب</text>

  <!-- Export Buttons Row -->
  <rect x="274" y="706" width="114" height="40" rx="12" fill="#14B8A6"/>
  <text x="331" y="730" text-anchor="middle" fill="#042F2E" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">چاپ / PDF</text>
  <rect x="152" y="706" width="114" height="40" rx="12" fill="#102937" stroke="#2DD4BF" stroke-width="1"/>
  <text x="209" y="730" text-anchor="middle" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">اکسل XLS</text>
  <rect x="30" y="706" width="114" height="40" rx="12" fill="#102937" stroke="#DAB978" stroke-width="1"/>
  <text x="87" y="730" text-anchor="middle" fill="#FDE68A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">فایل CSV</text>

  <!-- Bottom Floating Nav -->
  <rect x="16" y="798" width="388" height="64" rx="20" fill="#0B1F2A" stroke="#164E63" stroke-width="1.2"/>
  <text x="348" y="835" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">داشبورد</text>
  <text x="252" y="835" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">پوشه اقساط</text>
  <text x="158" y="835" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">هوش مالی</text>
  <rect x="24" y="808" width="90" height="44" rx="14" fill="#0F3E44" stroke="#2DD4BF" stroke-width="1"/>
  <text x="69" y="835" text-anchor="middle" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5" font-weight="bold">گزارش و تنظیمات</text>
</svg>
