  <text x="317" y="534" text-anchor="middle" fill="#0B2E36" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10" font-weight="bold">۲۷۱٫۳ میلیون</text>

  <rect x="158" y="502" width="102" height="40" rx="8" fill="#FEFCE8" stroke="#FDE047" stroke-width="0.9"/>
