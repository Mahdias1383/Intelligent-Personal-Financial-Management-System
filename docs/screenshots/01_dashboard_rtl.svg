  <text x="388" y="216" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="22" font-weight="bold">۱۸٬۴۵۰٬۰۰۰ تومان</text>
  <text x="388" y="235" text-anchor="start" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">هجده میلیون و چهارصد و پنجاه هزار تومان</text>

