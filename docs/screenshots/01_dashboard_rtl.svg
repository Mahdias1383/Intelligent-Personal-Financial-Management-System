  <text x="368" y="370" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">وام و تسهیلات بانکی (۴۸٪)</text>
  <text x="172" y="370" text-anchor="end" fill="#10B981" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">۸۴,۰۰۰,۰۰۰ ت</text>

  <circle cx="380" cy="396" r="5" fill="#8B5CF6"/>
  <text x="368" y="400" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">خرید اقساطی اسنپ‌پی و دیجی‌پی (۳۰٪)</text>
  <text x="172" y="400" text-anchor="end" fill="#A78BFA" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">۲۸,۵۰۰,۰۰۰ ت</text>

  <circle cx="380" cy="426" r="5" fill="#F59E0B"/>
  <text x="368" y="430" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">اشخاص حقیقی و چک صیادی (۲۲٪)</text>
  <text x="172" y="430" text-anchor="end" fill="#FBBF24" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">۲۴,۰۰۰,۰۰۰ ت</text>

  <circle cx="380" cy="454" r="5" fill="#06B6D4"/>
  <text x="368" y="458" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">صندوق قرض‌الحسنه و وام خانگی</text>
  <text x="172" y="458" text-anchor="end" fill="#22D3EE" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">۱۲,۰۰۰,۰۰۰ ت</text>

  <!-- 3. Top 3 Urgent Installments Card -->
  <rect x="16" y="490" width="388" height="236" rx="20" fill="url(#cardSurface)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="388" y="516" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">۳ سررسید فوری و اولویت‌دار</text>
  <rect x="28" y="501" width="84" height="22" rx="8" fill="#450A0A"/>
  <text x="70" y="516" text-anchor="middle" fill="#FCA5A5" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10" font-weight="bold">نیازمند اقدام</text>

  <!-- Urgent Item 1 -->
  <rect x="28" y="530" width="364" height="84" rx="14" fill="#0F172A" stroke="#EF4444" stroke-width="1.2"/>
  <rect x="314" y="540" width="66" height="20" rx="6" fill="#7F1D1D"/>
  <text x="347" y="554" text-anchor="middle" fill="#FECACA" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10" font-weight="bold">سررسید امروز</text>
  <text x="304" y="554" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">قسط ۲ لپ‌تاپ ایسوس (اسنپ‌پی)</text>
  <text x="380" y="574" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">پلتفرم اسنپ‌پی • سررسید: ۲۲ آبان ۱۴۰۵</text>
  <text x="380" y="598" text-anchor="start" fill="#10B981" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">۴,۰۰۰,۰۰۰ تومان</text>

  <!-- Rectangular Action Buttons on Urgent Item 1 -->
  <rect x="38" y="574" width="96" height="30" rx="10" fill="#10B981"/>
  <text x="86" y="593" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">✓ ثبت پرداخت</text>
  <rect x="142" y="574" width="76" height="30" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="180" y="593" text-anchor="middle" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">یادآوری فردا</text>

  <!-- Urgent Item 2 -->
  <rect x="28" y="624" width="364" height="84" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="314" y="634" width="66" height="20" rx="6" fill="#78350F"/>
  <text x="347" y="648" text-anchor="middle" fill="#FDE68A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10" font-weight="bold">۳ روز مانده</text>
  <text x="304" y="648" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">قسط ۵ وام ازدواج بانک ملت</text>
  <text x="380" y="668" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">بانک ملت • سررسید: ۲۵ آبان ۱۴۰۵</text>
  <text x="380" y="692" text-anchor="start" fill="#FBBF24" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">۳,۵۰۰,۰۰۰ تومان</text>
  <rect x="38" y="668" width="96" height="30" rx="10" fill="#10B981"/>
  <text x="86" y="687" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">✓ ثبت پرداخت</text>

  <!-- Floating Quick-Action Dock Bar -->
  <rect x="12" y="736" width="396" height="48" rx="14" fill="#17253B" stroke="#334155" stroke-width="1"/>
  <rect x="216" y="744" width="182" height="32" rx="10" fill="#10B981"/>
  <text x="307" y="765" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">+ ثبت خرید یا وام جدید</text>
  <rect x="22" y="744" width="184" height="32" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="114" y="765" text-anchor="middle" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">⚡ تسویه فوری: ۴,۰۰۰,۰۰۰ ت</text>

  <!-- Bottom Navigation Bar -->
  <rect x="12" y="790" width="396" height="56" rx="16" fill="#111A2E"/>
  <rect x="312" y="798" width="84" height="40" rx="12" fill="#064E3B"/>
  <text x="354" y="823" text-anchor="middle" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">داشبورد</text>
  <text x="256" y="823" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">پوشه اقساط</text>
  <text x="158" y="823" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">هوش مالی</text>
  <text x="62" y="823" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">گزارش و تنظیمات</text>
</svg>
