  <rect x="16" y="318" width="388" height="122" rx="20" fill="url(#dashCardV2)" stroke="#2DD4BF" stroke-width="1.1"/>
  <text x="388" y="344" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">✨ نکته مالی روزانه هوشمند</text>
