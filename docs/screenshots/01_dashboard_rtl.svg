  <rect x="210" y="398" width="178" height="30" rx="10" fill="#14B8A6"/>
  <text x="299" y="417" text-anchor="middle" fill="#042F2E" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">تنظیمات اتصال و حریم خصوصی</text>
  <text x="34" y="417" text-anchor="end" fill="#64748B" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">⋮⋮ اولویت ۱</text>

  <!-- 3. Reorderable Module: Financial Health Radar -->
  <rect x="16" y="450" width="388" height="178" rx="20" fill="url(#dashCardV2)" stroke="#164E63" stroke-width="1.2"/>
  <text x="388" y="476" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">رادار سلامت مالی ۵ بُعدی</text>
  <text x="388" y="494" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">پایش هم‌زمان نسبت بدهی به درآمد، نقدینگی و خوش‌حسابی</text>
  <text x="34" y="476" text-anchor="end" fill="#64748B" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">⋮⋮ اولویت ۲</text>

  <!-- Radar Shape Left -->
  <polygon points="104,514 156,548 136,606 72,606 52,548" fill="none" stroke="#1E3A4C" stroke-width="1"/>
  <polygon points="104,522 148,550 130,598 78,592 62,550" fill="#2DD4BF" fill-opacity="0.26" stroke="#2DD4BF" stroke-width="2"/>
  <text x="104" y="572" text-anchor="middle" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">۸۴٪</text>

  <!-- Radar Breakdown Right -->
  <text x="386" y="528" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">• نسبت اقساط به درآمد (DTI): ۳۲٪ (ایمن)</text>
  <text x="386" y="552" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">• خوش‌حسابی ۳۰ روز اخیر: ۹۶٪</text>
  <text x="386" y="576" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">• ذخیره پس‌انداز ماهانه: ۶۵٪ هدف</text>
  <text x="386" y="600" text-anchor="start" fill="#DAB978" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">• ریسک تمرکز سررسید: پایین و متعادل</text>

  <!-- 4. Reorderable Module: Debt Snowball Tracker -->
  <rect x="16" y="638" width="388" height="142" rx="20" fill="url(#dashCardV2)" stroke="#164E63" stroke-width="1.2"/>
  <text x="388" y="664" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">ردیاب گلوله برفی تسویه بدهی</text>
  <text x="34" y="664" text-anchor="end" fill="#DAB978" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5" font-weight="bold">۴ ماه سریع‌تر</text>
  <text x="388" y="688" text-anchor="start" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">بدهی هدف فعلی: خرید لپ‌تاپ (اسنپ‌پی) — مانده ۸ میلیون تومان</text>
  <rect x="32" y="702" width="356" height="9" rx="4.5" fill="#132D3B"/>
  <rect x="128" y="702" width="260" height="9" rx="4.5" fill="#DAB978"/>
  <text x="388" y="732" text-anchor="start" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">پیشرفت تسویه پرونده فعلی: ۷۳٪</text>
  <text x="388" y="756" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5">تاریخ آزادی کامل از بدهی با بودجه مازاد: بهمن ۱۴۰۶</text>

  <!-- Bottom Floating Navigation Bar -->
  <rect x="16" y="798" width="388" height="64" rx="20" fill="#0B1F2A" stroke="#164E63" stroke-width="1.2"/>
  <rect x="304" y="808" width="88" height="44" rx="14" fill="#0F3E44" stroke="#2DD4BF" stroke-width="1"/>
  <text x="348" y="835" text-anchor="middle" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">داشبورد</text>
  <text x="252" y="835" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">پوشه اقساط</text>
  <text x="158" y="835" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">هوش مالی</text>
  <text x="68" y="835" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5">گزارش و تنظیمات</text>
