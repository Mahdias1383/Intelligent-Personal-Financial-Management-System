  <rect x="16" y="128" width="388" height="180" rx="22" fill="url(#dashHeroV2)" stroke="#2DD4BF" stroke-width="1.2"/>
  <rect x="292" y="142" width="96" height="24" rx="8" fill="#042F2E" opacity="0.75"/>
