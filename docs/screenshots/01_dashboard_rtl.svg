<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="420" height="860" direction="rtl">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090F1B"/>
      <stop offset="100%" stop-color="#0E1729"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="55%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152036"/>
      <stop offset="100%" stop-color="#111A2E"/>
    </linearGradient>
  </defs>

  <!-- Phone Frame Background -->
  <rect width="420" height="860" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="3"/>

  <!-- Top App Bar -->
  <rect x="12" y="14" width="396" height="60" rx="16" fill="#111A2E"/>
  <text x="392" y="40" text-anchor="start" fill="#10B981" font-family="Vazirmatn, Tahoma, sans-serif" font-size="19" font-weight="bold">ترازینو</text>
  <text x="392" y="59" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">مدیریت هوشمند اقساط، بدهی و وام</text>

  <!-- Top Bar Controls (Left side in RTL) -->
  <rect x="24" y="28" width="54" height="30" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="51" y="48" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">تومان</text>
  <circle cx="98" cy="43" r="14" fill="#1E293B"/>
  <text x="98" y="48" text-anchor="middle" fill="#38BDF8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13">✨</text>
  <circle cx="132" cy="43" r="14" fill="#1E293B"/>
  <text x="132" y="48" text-anchor="middle" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">🔒</text>

  <!-- 1. Monthly Hero Card -->
  <rect x="16" y="86" width="388" height="196" rx="22" fill="url(#heroGrad)"/>
  <rect x="300" y="100" width="90" height="24" rx="8" fill="#022C22" opacity="0.55"/>
  <text x="345" y="116" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">وضعیت آبان ۱۴۰۵</text>
  <text x="32" y="116" text-anchor="end" fill="#D1FAE5" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">جمعه ۲۲ آبان ۱۴۰۵</text>

  <text x="388" y="146" text-anchor="start" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">مانده تعهدات این ماه:</text>
  <text x="388" y="176" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="24" font-weight="bold">۱۸,۴۵۰,۰۰۰ تومان</text>
  <text x="388" y="196" text-anchor="start" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">هجده میلیون و چهارصد و پنجاه هزار تومان</text>

  <!-- Progress Bar inside Hero -->
  <rect x="32" y="210" width="356" height="8" rx="4" fill="#022C22"/>
  <rect x="160" y="210" width="228" height="8" rx="4" fill="#34D399"/>

  <!-- 3 KPI Mini Pills in Hero -->
  <rect x="272" y="228" width="116" height="42" rx="10" fill="#022C22" opacity="0.55"/>
  <text x="330" y="244" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">پرداخت‌شده ماه</text>
  <text x="330" y="261" text-anchor="middle" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">۱۲,۲۰۰,۰۰۰ ت</text>

  <rect x="148" y="228" width="116" height="42" rx="10" fill="#022C22" opacity="0.55"/>
  <text x="206" y="244" text-anchor="middle" fill="#FDE68A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">سقف قسط جدید</text>
  <text x="206" y="261" text-anchor="middle" fill="#FBBF24" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">۶,۵۵۰,۰۰۰ ت</text>

  <rect x="28" y="228" width="112" height="42" rx="10" fill="#022C22" opacity="0.55"/>
  <text x="84" y="244" text-anchor="middle" fill="#BAE6FD" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">مطالبات از دیگران</text>
  <text x="84" y="261" text-anchor="middle" fill="#38BDF8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">۱۵,۰۰۰,۰۰۰ ت</text>

  <!-- 2. Donut Chart & Category Breakdown Card -->
  <rect x="16" y="294" width="388" height="184" rx="20" fill="url(#cardSurface)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="388" y="320" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">نمودار حلقه‌ای سهم هر دسته‌بندی</text>
  <text x="388" y="337" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">کل بدهی باقی‌مانده به تفکیک پوشه اصلی طرف‌حساب</text>

  <!-- Donut Ring Graphic -->
  <circle cx="96" cy="408" r="46" fill="none" stroke="#1E293B" stroke-width="16"/>
  <circle cx="96" cy="408" r="46" fill="none" stroke="#10B981" stroke-width="16" stroke-dasharray="135 290" stroke-dashoffset="0"/>
  <circle cx="96" cy="408" r="46" fill="none" stroke="#8B5CF6" stroke-width="16" stroke-dasharray="85 290" stroke-dashoffset="-138"/>
  <circle cx="96" cy="408" r="46" fill="none" stroke="#F59E0B" stroke-width="16" stroke-dasharray="62 290" stroke-dashoffset="-226"/>
  <text x="96" y="405" text-anchor="middle" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">۴ پرونده</text>
  <text x="96" y="421" text-anchor="middle" fill="#10B981" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">فعال</text>

