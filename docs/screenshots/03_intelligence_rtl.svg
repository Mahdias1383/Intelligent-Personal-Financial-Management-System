<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" width="420" height="880" direction="rtl">
  <defs>
    <linearGradient id="intelBgV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#051017"/>
      <stop offset="100%" stop-color="#081A24"/>
    </linearGradient>
    <linearGradient id="intelCardV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2430"/>
      <stop offset="100%" stop-color="#0A1B25"/>
    </linearGradient>
  </defs>

  <rect width="420" height="880" rx="28" fill="url(#intelBgV2)" stroke="#164E63" stroke-width="2.5"/>

  <!-- Header -->
  <rect x="16" y="16" width="388" height="58" rx="16" fill="#0B1F2A" stroke="#164E63" stroke-width="1"/>
  <text x="388" y="42" text-anchor="start" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" font-weight="bold">استراتژی مالی، زمان‌بند خودکار و پیش‌بینی</text>
  <text x="388" y="61" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">پیشنهاد بهترین روز پرداخت ماه + بودجه و پیش‌بینی هوشمند (BiDi اصلاح‌شده)</text>

  <!-- 1. Automated Payment Scheduler Card (Income Cycle Based) -->
  <rect x="16" y="88" width="388" height="236" rx="22" fill="url(#intelCardV2)" stroke="#2DD4BF" stroke-width="1.4"/>
  <text x="388" y="116" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">📅 زمان‌بند خودکار بهترین روز پرداخت اقساط</text>
  <text x="388" y="135" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">محاسبه‌شده بر اساس الگوی واریز درآمدهای ماهانه و سررسید اقساط</text>

  <rect x="218" y="148" width="170" height="72" rx="14" fill="#063B3D" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="303" y="170" text-anchor="middle" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5">روز پیشنهادی اصلی</text>
  <text x="303" y="198" text-anchor="middle" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" font-weight="bold">پنجم هر ماه شمسی</text>
  <text x="303" y="213" text-anchor="middle" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">بیشترین موجودی آزاد (۹۴٪ اطمینان)</text>

  <rect x="32" y="148" width="176" height="72" rx="14" fill="#102937" stroke="#DAB978" stroke-width="1"/>
  <text x="120" y="170" text-anchor="middle" fill="#FDE68A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5">روز مکمل (پرداخت دومرحله‌ای)</text>
  <text x="120" y="198" text-anchor="middle" fill="#DAB978" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" font-weight="bold">بیستم هر ماه</text>
  <text x="120" y="213" text-anchor="middle" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">کاهش ۶۲٪ فشار نقدینگی</text>

  <!-- Income Cycle Timeline Mini Bars -->
  <text x="388" y="242" text-anchor="start" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">چرخه جریان نقدینگی ماهانه (روز ۱ تا ۳۰):</text>
  <rect x="32" y="252" width="356" height="14" rx="7" fill="#07151D"/>
  <rect x="292" y="252" width="76" height="14" rx="7" fill="#2DD4BF"/>
  <rect x="130" y="252" width="54" height="14" rx="7" fill="#DAB978"/>
  <rect x="32" y="276" width="356" height="36" rx="11" fill="#14B8A6"/>
  <text x="210" y="299" text-anchor="middle" fill="#042F2E" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">✓ فعال‌سازی زمان‌بند خودکار برای روز ۵ و ۲۰ ماه</text>

  <!-- 2. ML Cashflow & Deficit Alert Card (Showing Clean RTL/BiDi Fix!) -->
  <rect x="16" y="336" width="388" height="162" rx="22" fill="url(#intelCardV2)" stroke="#164E63" stroke-width="1.2"/>
  <text x="388" y="364" text-anchor="start" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">بودجه و پیش‌بینی هوشمند جریان نقدینگی</text>
  <text x="34" y="364" text-anchor="end" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">نقدینگی آزاد: ۱۲٫۵ میلیون تومان</text>

  <!-- Clean BiDi-Isolated Alert Pill (Fixed order!) -->
  <rect x="30" y="380" width="360" height="44" rx="14" fill="#2B1418" stroke="#F87171" stroke-width="1.1"/>
  <circle cx="372" cy="402" r="5" fill="#F87171"/>
  <text x="358" y="407" text-anchor="start" fill="#FCA5A5" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="bold">هشدار پیش‌بینی هوشمند: ۲ ماه کسری در پیش است (نزدیک‌ترین: آذر)</text>

  <text x="388" y="448" text-anchor="start" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">• درآمد ماهانه: ۵۸ میلیون تومان • سهم مخارج ضروری: ۵۰٪</text>
  <text x="388" y="472" text-anchor="start" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">• سقف ایمن افزودن قسط جدید در ماه: ۶٫۵۵ میلیون تومان</text>

  <!-- 3. Symmetrical Avalanche vs Snowball Payoff Simulator -->
  <rect x="16" y="510" width="388" height="274" rx="22" fill="url(#intelCardV2)" stroke="#DAB978" stroke-width="1.2"/>
  <text x="388" y="538" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">شبیه‌ساز تسویه زودهنگام: بهمن در برابر گلوله برفی</text>
  <text x="388" y="558" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5">با اختصاص ۳ میلیون تومان بودجه مازاد ماهانه به تسویه بدهی‌ها</text>

  <!-- Right Column: Avalanche -->
  <rect x="214" y="572" width="176" height="148" rx="16" fill="#091D28" stroke="#2DD4BF" stroke-width="1.1"/>
  <text x="302" y="596" text-anchor="middle" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="bold">استراتژی بهمن</text>
  <text x="302" y="616" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">بیشترین نرخ سود در اولویت</text>
  <text x="302" y="646" text-anchor="middle" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15" font-weight="bold">دی ۱۴۰۶</text>
  <text x="302" y="666" text-anchor="middle" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">صرفه‌جویی سود:</text>
  <text x="302" y="688" text-anchor="middle" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="bold">۱۸٫۴ میلیون تومان</text>
  <text x="302" y="708" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">۵ ماه زودتر از برنامه</text>

  <!-- Left Column: Snowball -->
  <rect x="30" y="572" width="174" height="148" rx="16" fill="#091D28" stroke="#DAB978" stroke-width="1.1"/>
  <text x="117" y="596" text-anchor="middle" fill="#DAB978" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="bold">استراتژی گلوله برفی</text>
  <text x="117" y="616" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">حذف سریع کوچک‌ترین بدهی</text>
  <text x="117" y="646" text-anchor="middle" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15" font-weight="bold">بهمن ۱۴۰۶</text>
  <text x="117" y="666" text-anchor="middle" fill="#FDE68A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">اولین تسویه کامل:</text>
  <text x="117" y="688" text-anchor="middle" fill="#DAB978" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="bold">۲ ماه آینده</text>
  <text x="117" y="708" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5">۴ ماه زودتر از برنامه</text>

  <rect x="30" y="732" width="360" height="38" rx="12" fill="#063B3D"/>
  <text x="210" y="756" text-anchor="middle" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">تمام محاسبات شبیه‌ساز و پیش‌بینی ۱۰۰٪ آفلاین روی گوشی انجام می‌شود</text>

  <!-- Bottom Floating Nav -->
  <rect x="16" y="798" width="388" height="64" rx="20" fill="#0B1F2A" stroke="#164E63" stroke-width="1.2"/>
  <text x="348" y="835" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">داشبورد</text>
  <text x="252" y="835" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">پوشه اقساط</text>
  <rect x="114" y="808" width="88" height="44" rx="14" fill="#0F3E44" stroke="#2DD4BF" stroke-width="1"/>
  <text x="158" y="835" text-anchor="middle" fill="#2DD4BF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">هوش مالی</text>
  <text x="68" y="835" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5">گزارش و تنظیمات</text>
</svg>
