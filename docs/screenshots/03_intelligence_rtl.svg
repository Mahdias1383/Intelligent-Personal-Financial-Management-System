<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="420" height="860" direction="rtl">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090F1B"/>
      <stop offset="100%" stop-color="#0E1729"/>
    </linearGradient>
    <linearGradient id="cardSurface3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152036"/>
      <stop offset="100%" stop-color="#111A2E"/>
    </linearGradient>
  </defs>

  <rect width="420" height="860" rx="28" fill="url(#bgGrad3)" stroke="#1E293B" stroke-width="3"/>

  <!-- 1. Monthly Budget Planner & Safe Installment Capacity Card -->
  <rect x="16" y="20" width="388" height="236" rx="20" fill="url(#cardSurface3)" stroke="#10B981" stroke-width="1.5"/>
  <text x="388" y="48" text-anchor="start" fill="#10B981" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">پنل برنامه‌ریزی بودجه ماهانه و سقف مجاز قسط جدید</text>
  <rect x="28" y="30" width="96" height="28" rx="9" fill="#064E3B"/>
  <text x="76" y="48" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">تنظیم بودجه</text>

  <!-- 3 Budget Columns -->
  <rect x="272" y="66" width="116" height="58" rx="12" fill="#0F172A"/>
  <text x="330" y="86" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">درآمد خالص ماهانه</text>
  <text x="330" y="108" text-anchor="middle" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">۵۰,۰۰۰,۰۰۰ ت</text>

  <rect x="148" y="66" width="116" height="58" rx="12" fill="#0F172A"/>
  <text x="206" y="86" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">هزینه ضروری (۵۰٪)</text>
  <text x="206" y="108" text-anchor="middle" fill="#38BDF8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">۲۵,۰۰۰,۰۰۰ ت</text>

  <rect x="28" y="66" width="112" height="58" rx="12" fill="#0F172A"/>
  <text x="84" y="86" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">اقساط فعلی ماه</text>
  <text x="84" y="108" text-anchor="middle" fill="#FBBF24" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">۱۸,۴۵۰,۰۰۰ ت</text>

  <!-- Stacked Budget Allocation Bar -->
  <rect x="28" y="136" width="360" height="14" rx="7" fill="#1E293B"/>
  <rect x="208" y="136" width="180" height="14" rx="7" fill="#06B6D4"/>
  <rect x="86" y="136" width="122" height="14" fill="#F59E0B"/>
  <rect x="28" y="136" width="58" height="14" rx="7" fill="#10B981"/>

  <!-- Safe New Installment Capacity Box -->
  <rect x="28" y="162" width="360" height="78" rx="14" fill="#064E3B" opacity="0.65" stroke="#10B981" stroke-width="1"/>
  <text x="374" y="186" text-anchor="start" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">سقف امن افزودن قسط جدید در ماه (بدون فشار به معیشت):</text>
  <text x="374" y="212" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" font-weight="bold">۶,۵۵۰,۰۰۰ تومان در ماه</text>
  <text x="374" y="230" text-anchor="start" fill="#6EE7B7" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">شش میلیون و پانصد و پنجاه هزار تومان ظرفیت آزاد ماهانه</text>

  <!-- 2. Symmetrical Early Payoff Simulator (Fixed Screenshot 1 Issue!) -->
  <rect x="16" y="270" width="388" height="504" rx="20" fill="url(#cardSurface3)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="388" y="298" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">شبیه‌ساز تسویه زودهنگام بدهی‌ها</text>
  <text x="388" y="316" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">مقایسه استراتژی بهمن (حداقل هزینه) و گلوله برفی (حذف سریع بدهی کوچک)</text>

  <!-- 3 KPI Boxes -->
  <rect x="272" y="330" width="116" height="62" rx="12" fill="#0F172A"/>
  <text x="330" y="352" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">زمان تسویه عادی</text>
  <text x="330" y="376" text-anchor="middle" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">۵ ماه</text>

  <rect x="148" y="330" width="116" height="62" rx="12" fill="#0F172A"/>
  <text x="206" y="352" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">با بودجه مازاد</text>
  <text x="206" y="376" text-anchor="middle" fill="#10B981" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">۳ ماه</text>

  <rect x="28" y="330" width="112" height="62" rx="12" fill="#0F172A"/>
  <text x="84" y="352" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">صرفه‌جویی زمانی</text>
  <text x="84" y="376" text-anchor="middle" fill="#FBBF24" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">۲ ماه زودتر!</text>

  <!-- Exact Debt Freedom Banner -->
  <rect x="28" y="404" width="360" height="84" rx="14" fill="#2A1B0E" stroke="#F59E0B" stroke-width="1"/>
  <text x="374" y="428" text-anchor="start" fill="#FDE68A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">تاریخ دقیق شمسی آزادی کامل از بدهی: «پنجشنبه ۲۲ بهمن ۱۴۰۵»</text>
  <text x="374" y="450" text-anchor="start" fill="#FEF3C7" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">با افزودن ۳,۰۰۰,۰۰۰ تومان بودجه ماهانه، شما ۲ ماه زودتر کاملاً از بدهی رها</text>
  <text x="374" y="468" text-anchor="start" fill="#FEF3C7" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">می‌شوید و از جریمه‌های دیرکرد و ریسک برگشت چک صیادی جلوگیری می‌کنید.</text>

  <!-- Symmetrical 2-Column Strategy Selector (64.dp Equal Height!) -->
  <rect x="214" y="502" width="174" height="62" rx="14" fill="#3B1D0A" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="301" y="528" text-anchor="middle" fill="#FBBF24" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">استراتژی بهمن</text>
  <text x="301" y="548" text-anchor="middle" fill="#FDE68A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">حداقل هزینه و ریسک</text>

  <rect x="28" y="502" width="174" height="62" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="115" y="528" text-anchor="middle" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">استراتژی گلوله برفی</text>
  <text x="115" y="548" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">حذف سریع بدهی کوچک</text>

  <!-- Ordered Payoff Queue Items -->
  <rect x="28" y="578" width="360" height="54" rx="12" fill="#0F172A"/>
  <circle cx="364" cy="605" r="14" fill="#10B981"/>
  <text x="364" y="610" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">۱</text>
  <text x="340" y="600" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">چک صیادی اجاره‌بهای فصل پاییز</text>
  <text x="340" y="618" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">حاج‌آقا کریمی (صاحب‌خانه) • تسویه کامل در ماه ۱</text>
  <text x="40" y="610" text-anchor="end" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">۲۴,۰۰۰,۰۰۰ تومان</text>

  <rect x="28" y="640" width="360" height="54" rx="12" fill="#0F172A"/>
  <circle cx="364" cy="667" r="14" fill="#10B981"/>
  <text x="364" y="672" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">۲</text>
  <text x="340" y="662" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">خرید اقساطی لپ‌تاپ ایسوس (اسنپ‌پی)</text>
  <text x="340" y="680" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">پلتفرم اسنپ‌پی • تسویه کامل در ماه ۲</text>
  <text x="40" y="672" text-anchor="end" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">۱۲,۰۰۰,۰۰۰ تومان</text>

  <rect x="28" y="702" width="360" height="54" rx="12" fill="#0F172A"/>
  <circle cx="364" cy="729" r="14" fill="#10B981"/>
  <text x="364" y="734" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">۳</text>
  <text x="340" y="724" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">وام قرض‌الحسنه صندوق امید</text>
  <text x="340" y="742" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">صندوق خانگی امید • تسویه کامل در ماه ۳</text>
  <text x="40" y="734" text-anchor="end" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">۱۲,۰۰۰,۰۰۰ تومان</text>

  <!-- Bottom Navigation Bar -->
  <rect x="12" y="790" width="396" height="56" rx="16" fill="#111A2E"/>
  <text x="354" y="823" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">داشبورد</text>
  <text x="258" y="823" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">پوشه اقساط</text>
  <rect x="116" y="798" width="84" height="40" rx="12" fill="#064E3B"/>
  <text x="158" y="823" text-anchor="middle" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">هوش مالی</text>
  <text x="62" y="823" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">گزارش و تنظیمات</text>
</svg>
