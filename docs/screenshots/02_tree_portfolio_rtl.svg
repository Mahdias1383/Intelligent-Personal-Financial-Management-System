  <rect x="308" y="242" width="82" height="30" rx="9" fill="#10B981"/>
  <text x="349" y="261" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">همه اقساط</text>

