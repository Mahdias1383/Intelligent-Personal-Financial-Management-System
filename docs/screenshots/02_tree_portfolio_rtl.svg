  <text x="76" y="584" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">تسویه آنی</text>
  <rect x="132" y="564" width="84" height="30" rx="10" fill="#1E293B"/>
  <text x="174" y="584" text-anchor="middle" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">ویرایش قسط</text>

  <!-- Installment Row 3 (Selected for Batch Pay) -->
  <rect x="16" y="618" width="388" height="104" rx="16" fill="url(#cardSurface2)" stroke="#38BDF8" stroke-width="1.8"/>
  <rect x="366" y="632" width="22" height="22" rx="6" fill="#10B981"/>
  <text x="377" y="648" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">✓</text>
  <text x="354" y="648" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">قسط سوم — لپ‌تاپ ایسوس</text>
  <text x="388" y="670" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">سررسید شمسی: ۲۲ آذر ۱۴۰۵ • چهار میلیون تومان</text>
  <text x="388" y="698" text-anchor="start" fill="#38BDF8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">۴,۰۰۰,۰۰۰ تومان</text>
  <rect x="28" y="678" width="96" height="30" rx="10" fill="#10B981"/>
  <text x="76" y="698" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">تسویه آنی</text>
  <rect x="132" y="678" width="84" height="30" rx="10" fill="#1E293B"/>
  <text x="174" y="698" text-anchor="middle" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">ویرایش قسط</text>

  <!-- Bottom Navigation Bar -->
  <rect x="12" y="790" width="396" height="56" rx="16" fill="#111A2E"/>
  <text x="354" y="823" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">داشبورد</text>
  <rect x="214" y="798" width="88" height="40" rx="12" fill="#064E3B"/>
  <text x="258" y="823" text-anchor="middle" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">پوشه اقساط</text>
  <text x="158" y="823" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">هوش مالی</text>
  <text x="62" y="823" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">گزارش و تنظیمات</text>
</svg>
