<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="420" height="860" direction="rtl">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090F1B"/>
      <stop offset="100%" stop-color="#0E1729"/>
    </linearGradient>
    <linearGradient id="cardSurface2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152036"/>
      <stop offset="100%" stop-color="#111A2E"/>
    </linearGradient>
  </defs>

  <rect width="420" height="860" rx="28" fill="url(#bgGrad2)" stroke="#1E293B" stroke-width="3"/>

  <!-- Top Breadcrumb Bar -->
  <rect x="16" y="18" width="388" height="54" rx="14" fill="#111A2E" stroke="#1E293B" stroke-width="1"/>
  <text x="388" y="42" text-anchor="start" fill="#A78BFA" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">پوشه اصلی ◂ پلتفرم خرید اقساطی ◂ اسنپ‌پی (SnappPay)</text>
  <text x="388" y="60" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">پرونده فعال: خرید اقساطی لپ‌تاپ ایسوس (۴ قسط ماهانه)</text>

  <!-- Obligation Header Summary + Quick Edit Button -->
  <rect x="16" y="82" width="388" height="118" rx="18" fill="url(#cardSurface2)" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="388" y="108" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15" font-weight="bold">خرید اقساطی لپ‌تاپ ایسوس از اسنپ‌پی</text>
  <text x="388" y="128" text-anchor="start" fill="#C4B5FD" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">کل تعهد: ۱۶,۰۰۰,۰۰۰ تومان • مانده: ۱۲,۰۰۰,۰۰۰ تومان (۳ قسط)</text>

  <rect x="256" y="146" width="132" height="36" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
  <text x="322" y="169" text-anchor="middle" fill="#E2E8F0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">✎ ویرایش مشخصات وام</text>

  <rect x="120" y="146" width="126" height="36" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="183" y="169" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">+ افزودن قسط جدید</text>

  <rect x="28" y="146" width="84" height="36" rx="10" fill="#1E293B"/>
  <text x="70" y="169" text-anchor="middle" fill="#38BDF8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold">جدول A4</text>

