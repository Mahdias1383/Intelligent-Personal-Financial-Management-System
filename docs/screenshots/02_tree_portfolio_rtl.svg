  <text x="210" y="369" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="bold">✓ تسویه یک‌جای ۲ قسط انتخاب‌شده با یک کلیک</text>

  <!-- Installment Row 1 (Paid) -->
  <rect x="16" y="400" width="388" height="94" rx="16" fill="url(#cardSurface2)" stroke="#10B981" stroke-width="1"/>
  <rect x="310" y="412" width="78" height="22" rx="7" fill="#064E3B"/>
  <text x="349" y="427" text-anchor="middle" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10" font-weight="bold">✓ تسویه‌شده</text>
  <text x="298" y="427" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">قسط اول — لپ‌تاپ ایسوس</text>
  <text x="388" y="450" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">سررسید: ۲۲ مهر ۱۴۰۵ • پرداخت در ۲۱ مهر ۱۴۰۵</text>
  <text x="388" y="476" text-anchor="start" fill="#34D399" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">۴,۰۰۰,۰۰۰ تومان (چهار میلیون تومان)</text>

  <!-- Installment Row 2 (Selected for Batch Pay) -->
  <rect x="16" y="504" width="388" height="104" rx="16" fill="url(#cardSurface2)" stroke="#38BDF8" stroke-width="1.8"/>
  <rect x="366" y="518" width="22" height="22" rx="6" fill="#10B981"/>
  <text x="377" y="534" text-anchor="middle" fill="#022C22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">✓</text>
  <text x="354" y="534" text-anchor="start" fill="#F8FAFC" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">قسط دوم — لپ‌تاپ ایسوس (سررسید امروز)</text>
  <text x="388" y="556" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">سررسید شمسی: ۲۲ آبان ۱۴۰۵ • چهار میلیون تومان</text>
  <text x="388" y="584" text-anchor="start" fill="#FBBF24" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold">۴,۰۰۰,۰۰۰ تومان</text>
