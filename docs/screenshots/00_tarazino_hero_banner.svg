<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" direction="rtl">
  <defs>
    <linearGradient id="bannerBgV2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#032C30"/>
      <stop offset="50%" stop-color="#061A24"/>
      <stop offset="100%" stop-color="#040C12"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7C98A"/>
      <stop offset="100%" stop-color="#C89E52"/>
    </linearGradient>
    <linearGradient id="tealAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bannerBgV2)" stroke="#164E63" stroke-width="2.5"/>

  <!-- Subtle Ambient Aurora Circles -->
  <circle cx="195" cy="190" r="155" fill="#14B8A6" opacity="0.09"/>
  <circle cx="1075" cy="70" r="125" fill="#DAB978" opacity="0.07"/>
  <circle cx="620" cy="340" r="110" fill="#0EA5E9" opacity="0.06"/>

  <!-- Top Status Badge -->
  <rect x="860" y="34" width="296" height="34" rx="17" fill="#063B3D" stroke="#2DD4BF" stroke-width="1.4"/>
  <text x="1008" y="56" text-anchor="middle" fill="#99F6E4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">دستیار بومی اندروید • ۱۰۰٪ آفلاین و امن</text>

  <!-- Main Brand Headline -->
  <text x="1154" y="118" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="44" font-weight="bold">ترازینو (Tarazino)</text>
  <text x="1154" y="160" text-anchor="start" fill="#5EEAD4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="21" font-weight="bold">سامانه هوشمند و خصوصی مدیریت اقساط، بدهی، وام، چک صیادی و بودجه‌ریزی</text>
  <text x="1154" y="196" text-anchor="start" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14.5">معماری بومی اندروید (Kotlin + Jetpack Compose + Room SQLite) با مرکز کنترل «اتصال و حریم خصوصی»،</text>
  <text x="1154" y="222" text-anchor="start" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14.5">اسکنر قرارداد وام با دوربین (OCR آفلاین)، داشبورد چیدمان‌پذیر، زمان‌بند خودکار پرداخت و پوسته تاریک پُرکنتراست</text>

  <!-- Feature Pills Row 1 -->
  <rect x="954" y="252" width="202" height="44" rx="13" fill="url(#tealAccent)"/>
  <text x="1055" y="279" text-anchor="middle" fill="#042F2E" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="bold">تقویم ۱۰۰٪ شمسی جلالی</text>

  <rect x="752" y="252" width="190" height="44" rx="13" fill="#0A2530" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="847" y="279" text-anchor="middle" fill="#CCFBF1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">اتصال و حریم خصوصی</text>

  <rect x="556" y="252" width="184" height="44" rx="13" fill="#0A2530" stroke="#DAB978" stroke-width="1.2"/>
  <text x="648" y="279" text-anchor="middle" fill="#FDE68A" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">اسکنر قرارداد (OCR)</text>

  <rect x="374" y="252" width="170" height="44" rx="13" fill="#0A2530" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="459" y="279" text-anchor="middle" fill="#BAE6FD" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">داشبورد چیدمان‌پذیر</text>

  <!-- Feature Pills Row 2 -->
  <rect x="954" y="308" width="202" height="36" rx="11" fill="#081C26" stroke="#1E3A4C" stroke-width="1"/>
  <text x="1055" y="331" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">زمان‌بند خودکار چرخه درآمد</text>

  <rect x="752" y="308" width="190" height="36" rx="11" fill="#081C26" stroke="#1E3A4C" stroke-width="1"/>
  <text x="847" y="331" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">پوسته روشن / تاریک شبانه</text>

  <rect x="556" y="308" width="184" height="36" rx="11" fill="#081C26" stroke="#1E3A4C" stroke-width="1"/>
  <text x="648" y="331" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">چاپ A4 رنگی و اکسل RTL</text>

  <rect x="374" y="308" width="170" height="36" rx="11" fill="#081C26" stroke="#1E3A4C" stroke-width="1"/>
  <text x="459" y="331" text-anchor="middle" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12">استاندارد کامل RTL/BiDi</text>

  <!-- Left Side: Live v0.2 Preview Card (Privacy Shield + Radar + Clear Persian Currency) -->
  <rect x="36" y="34" width="308" height="312" rx="24" fill="#091B24" stroke="#2DD4BF" stroke-width="1.8"/>
  <rect x="54" y="50" width="110" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
  <text x="109" y="66" text-anchor="middle" fill="#A7F3D0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5" font-weight="bold">حالت آفلاین مطلق</text>
  <text x="326" y="67" text-anchor="start" fill="#5EEAD4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="bold">رادار سلامت مالی</text>

  <!-- Radar Pentagon Graphic -->
  <polygon points="190,100 255,146 230,222 150,222 125,146" fill="none" stroke="#1E3A4C" stroke-width="1.2"/>
  <polygon points="190,122 234,154 217,205 163,205 146,154" fill="none" stroke="#1E3A4C" stroke-width="1"/>
  <polygon points="190,110 246,150 222,214 156,204 138,150" fill="#14B8A6" fill-opacity="0.28" stroke="#2DD4BF" stroke-width="2.2"/>
  <circle cx="190" cy="110" r="4" fill="#2DD4BF"/>
  <circle cx="246" cy="150" r="4" fill="#DAB978"/>
  <circle cx="222" cy="214" r="4" fill="#38BDF8"/>
  <circle cx="156" cy="204" r="4" fill="#34D399"/>
  <circle cx="138" cy="150" r="4" fill="#2DD4BF"/>
  <text x="190" y="92" text-anchor="middle" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">نقدینگی</text>
  <text x="278" y="152" text-anchor="middle" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">خوش‌حسابی</text>
  <text x="102" y="152" text-anchor="middle" fill="#CBD5E1" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10">پس‌انداز</text>

  <!-- Mini Metrics Footer in Preview Card -->
  <rect x="52" y="246" width="276" height="82" rx="16" fill="#0D2531" stroke="#164E63" stroke-width="1"/>
  <text x="314" y="272" text-anchor="start" fill="#94A3B8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11">مانده اقساط ماه جاری:</text>
  <text x="314" y="298" text-anchor="start" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="17" font-weight="bold">۱۸٫۴۵ میلیون تومان</text>
  <text x="314" y="317" text-anchor="start" fill="#DAB978" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5">امتیاز حریم خصوصی: ۱۰۰ از ۱۰۰ • بدون ارسال داده</text>
</svg>
