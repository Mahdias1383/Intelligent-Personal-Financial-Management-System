name: Publish Tarazino v0.1 APK to GitHub Releases

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "تگ نسخه انتشار (مثلاً v0.1)"
        required: false
        default: "v0.1"

permissions:
  contents: write

jobs:
  publish-release-v0-1:
    name: Publish Tarazino-v0.1.apk to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Pre-Built APK & Checksum
        run: |
          ls -lh releases/Tarazino-v0.1.apk
          sha256sum releases/Tarazino-v0.1.apk > releases/Tarazino-v0.1.apk.sha256

      - name: Create or Update GitHub Release v0.1 via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag || 'v0.1' }}"
          TITLE="ترازینو نسخه ۰.۱ (Tarazino v0.1) — انتشار رسمی اندروید (APK)"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              releases/Tarazino-v0.1.apk \
              releases/Tarazino-v0.1.apk.sha256 \
              --clobber
            gh release edit "$TAG_NAME" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES_v0.1.md \
              --draft=false \
              --prerelease=false
          else
            gh release create "$TAG_NAME" \
              releases/Tarazino-v0.1.apk \
              releases/Tarazino-v0.1.apk.sha256 \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES_v0.1.md \
              --latest
          fi
