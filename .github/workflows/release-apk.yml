name: Build & Publish Tarazino v0.1 APK to GitHub Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "تگ نسخه انتشار (مثلاً v0.1)"
        required: false
        default: "v0.1"

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build Android APK & Create GitHub Release v0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure debug.keystore exists for signing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env exists from .env.example
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Tarazino v0.1 Installable APK
        run: gradle assembleDebug

      - name: Prepare Named APK Artifact (Tarazino-v0.1.apk)
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/Tarazino-v0.1.apk
          sha256sum release-artifacts/Tarazino-v0.1.apk > release-artifacts/Tarazino-v0.1.apk.sha256

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tarazino-v0.1-APK
          path: |
            release-artifacts/Tarazino-v0.1.apk
            release-artifacts/Tarazino-v0.1.apk.sha256

      - name: Publish Release v0.1 to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v0.1' }}
          name: "ترازینو نسخه ۰.۱ (Tarazino v0.1) — انتشار رسمی اندروید (APK)"
          body_path: RELEASE_NOTES_v0.1.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/Tarazino-v0.1.apk
            release-artifacts/Tarazino-v0.1.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
