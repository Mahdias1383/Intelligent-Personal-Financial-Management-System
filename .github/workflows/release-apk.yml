name: Publish Tarazino v0.1 & v0.2 Clean APKs to GitHub Releases

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "تگ نسخه انتشار (مثلاً v0.2)"
        required: false
        default: "v0.2"

permissions:
  contents: write

jobs:
  publish-clean-releases:
    name: Build & Publish Clean Tarazino v0.1 and v0.2 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses & Verify SDK 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MGR" ]; then
            SDK_MGR="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDK_MGR" ]; then
            set +o pipefail
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDK_MGR" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle 9.3.1 Binary Is Available
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sSL -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
            unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp/gradle-dist
            echo "/tmp/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          fi

      - name: Build Clean Production APKs for v0.1 and v0.2 (Zero Demo/Test Data)
        run: |
          mkdir -p releases
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              printf '%s' "" | base64 -d > debug.keystore
            fi
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore
          gradle --version

          # 1. Build clean Tarazino-v0.1.apk (versionCode=1, versionName=0.1, zero demo data)
          gradle assembleDebug \
            -PoverrideVersionCode=1 \
            -PoverrideVersionName=0.1 \
            -PpreloadDevSampleData=false \
            --no-daemon --no-configuration-cache --max-workers=2 --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk releases/Tarazino-v0.1.apk
          sha256sum releases/Tarazino-v0.1.apk > releases/Tarazino-v0.1.apk.sha256

          # 2. Build clean Tarazino-v0.2.apk (versionCode=2, versionName=0.2, zero demo data)
          gradle assembleDebug \
            -PoverrideVersionCode=2 \
            -PoverrideVersionName=0.2 \
            -PpreloadDevSampleData=false \
            --no-daemon --no-configuration-cache --max-workers=2 --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk releases/Tarazino-v0.2.apk
          sha256sum releases/Tarazino-v0.2.apk > releases/Tarazino-v0.2.apk.sha256

          ls -lh releases/
          cat releases/Tarazino-v0.1.apk.sha256
          cat releases/Tarazino-v0.2.apk.sha256

      - name: Update Both GitHub Releases (v0.1 and v0.2) with Clean APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --- Update / Create Release v0.1 (Clean Zero-Data APK) ---
          TAG_V1="v0.1"
          TITLE_V1="ترازینو نسخه ۰.۱ — Tarazino v0.1"
          NOTES_V1="RELEASE_NOTES_v0.1.md"
          if [ ! -f "$NOTES_V1" ]; then
            echo "ترازینو نسخه ۰.۱ (Tarazino v0.1) — نسخه خام و بدون داده آزمایشی" > /tmp/release_notes_v01.md
            NOTES_V1="/tmp/release_notes_v01.md"
          fi

          if gh release view "$TAG_V1" >/dev/null 2>&1; then
            gh release upload "$TAG_V1" \
              releases/Tarazino-v0.1.apk \
              releases/Tarazino-v0.1.apk.sha256 \
              --clobber
            gh release edit "$TAG_V1" \
              --title "$TITLE_V1" \
              --notes-file "$NOTES_V1" \
              --draft=false \
              --prerelease=false
          else
            gh release create "$TAG_V1" \
              releases/Tarazino-v0.1.apk \
              releases/Tarazino-v0.1.apk.sha256 \
              --target "${{ github.sha }}" \
              --title "$TITLE_V1" \
              --notes-file "$NOTES_V1" \
              --latest=false
          fi

          # --- Update / Create Release v0.2 (Latest Clean Zero-Data APK) ---
          TAG_V2="${{ github.event.inputs.release_tag || 'v0.2' }}"
          TITLE_V2="ترازینو نسخه ۰.۲ — Tarazino v0.2"
          NOTES_V2="RELEASE_NOTES_v0.2.md"
          if [ ! -f "$NOTES_V2" ]; then
            echo "ترازینو نسخه ۰.۲ (Tarazino v0.2) — نسخه خام و بدون داده آزمایشی" > /tmp/release_notes_v02.md
            NOTES_V2="/tmp/release_notes_v02.md"
          fi

          if gh release view "$TAG_V2" >/dev/null 2>&1; then
            gh release upload "$TAG_V2" \
              releases/Tarazino-v0.2.apk \
              releases/Tarazino-v0.2.apk.sha256 \
              --clobber
            gh release edit "$TAG_V2" \
              --title "$TITLE_V2" \
              --notes-file "$NOTES_V2" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "$TAG_V2" \
              releases/Tarazino-v0.2.apk \
              releases/Tarazino-v0.2.apk.sha256 \
              --target "${{ github.sha }}" \
              --title "$TITLE_V2" \
              --notes-file "$NOTES_V2" \
              --latest
          fi
